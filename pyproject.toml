[project]
name = "mcp-ucdavis"
version = "1.0.0"
description = "MCP server exposing a UC Davis AI knowledge base (RAG) and web search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.1",
    "ddgs>=9.0",
    "uvicorn",
    "pydantic-settings",
    "python-dotenv",
    "pymupdf",
    "docx2txt>=0.8",
    "sentence-transformers",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-postgres>=0.0.17",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

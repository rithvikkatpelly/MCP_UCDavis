[project]
name = "mcp-ucdavis"
version = "1.0.0"
description = "MCP server exposing a UC Davis AI knowledge base (RAG) and web search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.1",
    "ddgs>=9.0",
    "uvicorn",
    "pydantic-settings",
    "python-dotenv",
    "pymupdf",
    "docx2txt>=0.8",
    "sentence-transformers",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-postgres>=0.0.17",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "ruff==0.16.6",
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "UC Davis AI", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Re-exports and import-order in package inits are intentional.
"__init__.py" = ["F401"]
